---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          type_pattern='feat|fix|perf|revert|docs|test|ci|chore|refactor'
          title_pattern="^(${type_pattern})(\([a-z0-9._/-]+\))?!?: .+"
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            marker="$(printf '::%s::' error)"
            echo "${marker}PR title must be a conventional commit."
            echo "${marker}Use fix:/feat:/perf: for release-worthy changes."
            echo "${marker}Use docs:/test:/ci:/chore:/refactor: otherwise."
            exit 1
          fi
      - name: Configure git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install tools
        run: |
          uv sync --locked --group dev
          uv run ansible-galaxy collection install -r requirements-dev.yml
      - name: Run pre-commit checks
        run: uv run --locked pre-commit run --all-files
      - name: Test maintenance endpoint cleanup trap
        run: bash tests/maintenance-endpoint.sh
      - name: Run negative validation checks
        run: >-
          uv run ansible-playbook -i localhost, -c local
          tests/validation-negative.yml
      - name: Run client sidecar render check
        run: >-
          uv run ansible-playbook -i localhost, -c local
          tests/client-sidecar-render.yml
      - name: Build collection
        run: uv run ansible-galaxy collection build --force

  scenarios:
    name: scenario (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            command: |
              molecule_schema_filter="$(
                printf '%s%s  Driver docker does not provide a schema.' WARN ING
              )"
              uv run molecule converge --no-report \
                2> >(grep -v -F "$molecule_schema_filter" >&2)
              uv run molecule converge --no-report -- --check --diff \
                2> >(grep -v -F "$molecule_schema_filter" >&2)
              uv run molecule verify --no-report \
                2> >(grep -v -F "$molecule_schema_filter" >&2)
          - name: fresh-check
            command: |
              set -o pipefail
              fresh_check_output="$(mktemp)"
              trap 'uv run molecule destroy -s fresh-check --no-report' EXIT
              uv run molecule create -s fresh-check --no-report
              uv run molecule converge -s fresh-check --no-report \
                -- --check --diff | tee "$fresh_check_output"
              awk '
                /TASK \[.*Write per-friend Compose file\]/ {
                  task="server"; next
                }
                /TASK \[.*Write restic Compose files\]/ { task="client"; next }
                /TASK \[.*Converge per-friend server stacks\]/ {
                  task="server_runtime"; next
                }
                /TASK \[.*Check for existing restic repositories\]/ {
                  task="client_check"; next
                }
                /TASK \[.*Initialize missing restic repositories\]/ {
                  task="client_init"; next
                }
                /TASK \[.*Run initial backups\]/ { task="client_backup"; next }
                /TASK \[.*Write backup systemd services\]/ {
                  task="backup_service"; next
                }
                /TASK \[.*Write backup systemd timers\]/ {
                  task="backup_timer"; next
                }
                /TASK \[.*Write check systemd services\]/ {
                  task="check_service"; next
                }
                /TASK \[.*Write check systemd timers\]/ {
                  task="check_timer"; next
                }
                /TASK \[.*Enable backup timers\]/ { task="enable_backup"; next }
                /TASK \[.*Enable check timers\]/ { task="enable_check"; next }
                /^TASK / { task="" }
                /^changed:/ && task == "server" { server=1 }
                /^changed:/ && task == "client" { client=1 }
                /^changed:/ && task == "backup_service" { backup_service=1 }
                /^changed:/ && task == "backup_timer" { backup_timer=1 }
                /^changed:/ && task == "check_service" { check_service=1 }
                /^changed:/ && task == "check_timer" { check_timer=1 }
                /^skipping:/ && task == "server_runtime" { server_runtime=1 }
                /^skipping:/ && task == "client_check" { client_check=1 }
                /^skipping:/ && task == "client_init" { client_init=1 }
                /^skipping:/ && task == "client_backup" { client_backup=1 }
                /^skipping:/ && task == "enable_backup" { enable_backup=1 }
                /^skipping:/ && task == "enable_check" { enable_check=1 }
                END {
                  exit !(server && client && server_runtime && client_check &&
                         client_init && client_backup && backup_service &&
                         backup_timer && check_service && check_timer &&
                         enable_backup && enable_check)
                }
              ' "$fresh_check_output"
              uv run molecule verify -s fresh-check --no-report
              uv run molecule destroy -s fresh-check --no-report
              trap - EXIT
          - name: cleanup
            command: uv run molecule test -s cleanup --no-report
          - name: systemd
            command: uv run molecule test -s systemd --no-report
          - name: rest-rotation
            command: uv run molecule test -s rest-rotation --no-report
          - name: local-backup-restore
            command: >-
              uv run ansible-playbook -i localhost, -c local tests/e2e-local.yml
          - name: restic-key-rotation
            command: >-
              uv run ansible-playbook -i localhost, -c local
              tests/restic-key-rotation.yml
          - name: quota-full-recovery
            command: >-
              sudo -E "$(command -v uv)" run ansible-playbook
              -i localhost, -c local tests/quota-full.yml
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install tools
        run: |
          uv sync --locked --group dev
          uv run ansible-galaxy collection install -r requirements-dev.yml
      - name: Run ${{ matrix.name }} scenario
        run: ${{ matrix.command }}

  lint:
    if: ${{ always() }}
    needs:
      - checks
      - scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI jobs
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.scenarios.result }}" = success
